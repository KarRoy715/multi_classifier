data:
  root: /tcfs/fs_dev/zhaoaohui/Project/VLM/multi_classifier/multi_data/data0910/rejudged
  class_config: /tcfs/fs_dev/zhaoaohui/Project/VLM/multi_classifier/configs/classes.yaml
  train_ratio: 0.8
  seed: 42
  phash_max_dist: 4
  splits_out: /tcfs/fs_dev/zhaoaohui/Project/VLM/multi_classifier/data/splits.jsonl
  materialize_mode: symlink
  materialize_dir: /tcfs/fs_dev/zhaoaohui/Project/VLM/multi_classifier/data
preprocess:
  mode: letterbox
  resolution: null
  augment: mild
model:
  backbone: clip
  model_name_or_path: models/clip-vit-large-patch14-336
