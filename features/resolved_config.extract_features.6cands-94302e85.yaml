data:
  root: /mnt/fs_dev/zhaoaohui/Project/VLM/multi_classifier/multi_data/data0910/rejudged
  class_config: /mnt/fs_dev/zhaoaohui/Project/VLM/multi_classifier/configs/classes.yaml
  train_ratio: 0.8
  seed: 42
  phash_max_dist: 4
  splits_out: /mnt/fs_dev/zhaoaohui/Project/VLM/multi_classifier/data/splits.jsonl
  materialize_mode: symlink
  materialize_dir: /mnt/fs_dev/zhaoaohui/Project/VLM/multi_classifier/data
preprocess:
  mode: letterbox
  augment: mild
model:
  backbone: clip
  model_name_or_path: clip-vit-large-patch14-336
  resolution: null
  unfreeze_blocks: 2
  dropout: 0.3
  hidden_dim: 256
train:
  epochs: 30
  batch_size: 64
  lr: 0.001
  backbone_lr_multiplier: 0.1
  weight_decay: 0.001
  label_smoothing: 0.1
  class_weight: sqrt
  select_by: macro-f1
  patience: 5
  num_workers: 8
  amp: bf16
  seed: 42
  grad_clip: 1.0
  checkpoint_dir: /mnt/fs_dev/zhaoaohui/Project/VLM/multi_classifier/checkpoints
  wandb:
    enabled: false
    project: multi-classifier
    run_name: null
features:
  out_dir: /mnt/fs_dev/zhaoaohui/Project/VLM/multi_classifier/features
  batch_size: 64
  amp: bf16
  flush_every: 20
probe:
  normalize: l2
  cs:
  - 0.01
  - 0.1
  - 1.0
  - 10.0
  max_iter: 2000
  knn_k: 20
  mlp:
    epochs: 40
    lr: 0.001
    weight_decay: 0.001
    hidden: 256
    dropout: 0.3
    batch_size: 256
    seed: 42
    amp: bf16
eval:
  checkpoint: checkpoints/best.pt
  out_dir: /mnt/fs_dev/zhaoaohui/Project/VLM/multi_classifier/outputs/eval
  batch_size: 64
  top_confusions: 15
  confusion_matrix_png: true
predict:
  batch_size: 64
  top_k: 3
  out: null
runtime:
  models_root: /mnt/fs_dev/zhaoaohui/models
  device: cuda
  seed: 42
  hf_offline: true
candidates:
- name: clip_l336
  backbone: clip
  model_name_or_path: clip-vit-large-patch14-336
  resolution: 336
  feat_dim: 768
  note: 兄弟项目二分类的最优 backbone，作为本次的基准线
- name: dinov3_l16
  backbone: dinov3
  model_name_or_path: dinov3-vitl16-pretrain
  resolution: 224
  feat_dim: 1024
  note: 较新的自监督 backbone，RoPE 位置编码，分辨率灵活
- name: dinov2_l14
  backbone: dinov2
  model_name_or_path: dinov2_vitl14
  resolution: 224
  feat_dim: 1024
- name: dinov2_b14
  backbone: dinov2
  model_name_or_path: dinov2-base
  resolution: 224
  feat_dim: 768
  note: 小模型对照，用来确认大模型是否真的值得
- name: siglip_so400m
  backbone: siglip
  model_name_or_path: siglip
  resolution: 384
  feat_dim: 1152
- name: siglip2_b32
  backbone: siglip
  model_name_or_path: siglip2-base-p32-256-ve
  resolution: 256
  feat_dim: 768
resolution_ablation:
  enabled: false
  base_candidate: dinov3_l16
  resolution: 448
  name_suffix: _r448
_provenance:
  config_files:
  - /mnt/fs_dev/zhaoaohui/Project/VLM/multi_classifier/configs/base.yaml
  - /mnt/fs_dev/zhaoaohui/Project/VLM/multi_classifier/configs/bakeoff.yaml
  git_commit: null
  python: 3.11.15
  platform: Linux-6.8.0-124-generic-x86_64-with-glibc2.39
